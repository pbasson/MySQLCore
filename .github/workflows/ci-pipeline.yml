name: MySQLCore CI

on:
  push:
    branches:
      - development
      - master

  pull_request:
    branches:
      - development
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Build API Docker image
        run: docker build . --file ./src/MySQLCore.API/Dockerfile --tag mysqlcore-api:ci

      - name: Build Worker Docker image
        run: docker build . --file ./worker/MySQLCore.Worker/Dockerfile --tag mysqlcore-worker:ci